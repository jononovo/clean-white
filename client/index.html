<!DOCTYPE html>
<html lang="en" class="dark" data-theme="warm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <title>SecureClawHub - Trusted OpenClaw Directory</title>
    <meta name="description" content="The premier security-focused registry for OpenClaw skills, services, and SDKs. Audited, ranked, and verified." />
    
    <meta property="og:title" content="SecureClawHub" />
    <meta property="og:description" content="Audited and ranked directory for OpenClaw bots and skills." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@openclaw" />
    <meta name="twitter:title" content="SecureClawHub" />
    <meta name="twitter:description" content="The trusted security layer for the OpenClaw ecosystem." />

    <link rel="icon" type="image/png" href="/logo_v2.png" />
    
    <!-- Fonts: Plus Jakarta Sans (Headings), Inter (UI), JetBrains Mono (Code), Nunito (Warm Theme) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Immediate theme application to prevent white flash
      try {
        const saved = localStorage.getItem('theme-preference');
        if (saved) {
          const theme = JSON.parse(saved);
          if (theme.mode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme', theme.style);
        }
      } catch (e) {
        console.error("Error setting initial theme", e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
